<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Talk to a diagram editor in English. Rules, a VSS reader and transformer readers formalize each message into SOP Lang wires that one engine runs.">
<title>SOP Sketchpad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="help/docs.css">
<link rel="stylesheet" href="voice.css">
<style>
/* Layout: a messaging app with a drawing board pinned beside it (desktop) or above it (phone).
   Chat bubbles carry plain-language replies; a bubble's "details" shows the wires, patches and model evidence of that message. */
:root {
  --app: #DADFE3;
  --head: #F0F2F5;
  --chat: #EFEAE2;
  --dots: rgba(17, 27, 33, .05);
  --bubble: #FFFFFF;
  --mine: #D9FDD3;
  --ink: #111B21;
  --muted: #667781;
  --faint: #8C9AA3;
  --line: #D1D7DB;
  --accent: #00A884;
  --accent-ink: #FFFFFF;
  --link: #027EB5;
  --pill: #FFFFFF;
  --err: #C1392B;
  --warn-soft: #FFF3D6; --amber-ink: #8A5300; --amber-line: #E8B64C;
  --canvas: #FFFFFF;
  --grid: #E1E5E8;
  --frame: #C8D0D6;
  --edge: #3B4A54;
  --shape-edge: rgba(17, 27, 33, .45);
  --hl: #027EB5;
  --sheet: #FFFFFF;
  --code-bg: #F6F8F9;
  --wid: #1D4ED8;
  --rf: #A64B12;
  --str: #127A52;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --app: #0C1317; --head: #202C33; --chat: #0B141A; --dots: rgba(233, 237, 239, .035); --bubble: #202C33; --mine: #005C4B;
    --ink: #E9EDEF; --muted: #8696A0; --faint: #667781; --line: #2A3942; --accent: #00A884; --accent-ink: #0B141A; --link: #53BDEB; --pill: #182229;
    --err: #F1786B; --warn-soft: #3A3018; --amber-ink: #F3C46B; --amber-line: #7A5A1E; --canvas: #111B21; --grid: #1E2A31; --frame: #2E3D46; --edge: #AEBAC1; --shape-edge: rgba(233, 237, 239, .4);
    --hl: #53BDEB; --sheet: #111B21; --code-bg: #0B141A; --wid: #8EA5FF; --rf: #F0A06A; --str: #6CD4A0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --app: #0C1317; --head: #202C33; --chat: #0B141A; --dots: rgba(233, 237, 239, .035); --bubble: #202C33; --mine: #005C4B;
  --ink: #E9EDEF; --muted: #8696A0; --faint: #667781; --line: #2A3942; --accent: #00A884; --accent-ink: #0B141A; --link: #53BDEB; --pill: #182229;
  --err: #F1786B; --warn-soft: #3A3018; --amber-ink: #F3C46B; --amber-line: #7A5A1E; --canvas: #111B21; --grid: #1E2A31; --frame: #2E3D46; --edge: #AEBAC1; --shape-edge: rgba(233, 237, 239, .4);
  --hl: #53BDEB; --sheet: #111B21; --code-bg: #0B141A; --wid: #8EA5FF; --rf: #F0A06A; --str: #6CD4A0; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--app); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; overflow: hidden; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- app grid ---------- */
/* the dictation dock (docs/js/voice.js, docs/voice.css) sits under the drawing, level with the message box (desktop), or just above the
   message box (phone) */
.app { height: var(--app-h, 100%); display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 420px); grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "stage head" "stage msgs" "stage player" "dock comp"; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.head { grid-area: head; background: var(--head); display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-left: 1px solid var(--line); min-width: 0; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--mono); font-weight: 600; font-size: 19px; flex: none; }
.who { flex: 1; min-width: 0; }
.who b { display: block; font-weight: 600; font-size: 16px; }
/* a tab that is not at its safety threshold (ui.js renderGateBadges): an amber badge per tab, which opens its Settings, and one button back */
.gbadges { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 4px 6px; max-width: 58%; }
.gbadge { border: 1px solid var(--amber-line); background: var(--warn-soft); color: var(--amber-ink); border-radius: 999px; padding: 2px 9px; font: 600 12px/1.5 var(--font); cursor: pointer; white-space: nowrap; }
.gbadge:hover { filter: brightness(.97); }
.gback { border: 0; background: none; color: var(--link); font: 500 12px/1.5 var(--font); cursor: pointer; padding: 2px 4px; white-space: nowrap; text-decoration: underline; text-underline-offset: 2px; }
@media (max-width: 560px) { .gbadges { max-width: 62%; } .gbadge { padding: 1px 7px; font-size: 11.5px; } .gback { font-size: 11.5px; } }
.who span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ib { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--muted); flex: none; }
.ib:hover { background: rgba(127, 127, 127, .14); color: var(--ink); }

.stage { grid-area: stage; position: relative; background: var(--canvas); min-height: 0; min-width: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
/* reader tabs: each reader (VSS-BERT, Rules, VSS, SOP-BERT) has its own drawing; the canvas shows the active one. On a narrow
   screen the tabs scroll sideways inside their strip instead of running under the tools. */
.rbar { display: flex; align-items: center; gap: 8px; padding: max(8px, env(safe-area-inset-top, 0px)) 10px 0 16px; border-bottom: 1px solid var(--line); background: var(--head); min-width: 0; }
.rtabs { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.rtabs::-webkit-scrollbar { display: none; }
.rtab { border: 0; background: none; padding: 8px 12px 9px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; font-weight: 600; white-space: nowrap; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.rtab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.rtab.off { font-weight: 500; opacity: .62; }
.rtab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rf); display: inline-block; }
.rtab .spin { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); display: inline-block; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tools { display: flex; gap: 4px; flex: none; padding-bottom: 4px; }
.tools .ib { width: 36px; height: 36px; }
.tools .ib svg.i { width: 19px; height: 19px; }
.board { position: relative; min-height: 0; min-width: 0; }
/* subtabs of the active reader: Drawing (the canvas) | SOP (its drawing as SOP wires) | Settings (that reader's settings and state) */
.subbar { display: flex; align-items: center; gap: 4px; padding: 5px 16px; border-bottom: 1px solid var(--line); background: var(--head); min-width: 0; }
.subtab { border: 1px solid transparent; background: none; border-radius: 999px; padding: 2px 11px; cursor: pointer; color: var(--muted); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.subtab:hover { color: var(--ink); }
.subtab[aria-selected="true"] { background: var(--pill); border-color: var(--line); color: var(--ink); font-weight: 600; }
.subbar .of { margin-left: auto; font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.rpanel { position: absolute; inset: 0; z-index: 3; overflow-y: auto; overflow-x: hidden; background: var(--canvas); padding: 12px 16px 20px; font-size: 14px; overscroll-behavior: contain; }
.rpanel .sop { max-width: 100%; }
.rpanel h3.sub:first-child { margin-top: 2px; }
/* the Settings and SOP Lang subtabs: the explanations flow over the panel's width (up to a readable line), justified and hyphenated from
   421 px up as on the help pages (docs/help/docs.css), left-aligned on phones; the panel is the only scroll box (owner, 2026-11-03) */
.rpanel .intro, .rpanel p.note, .rpanel .note { max-width: 96ch; white-space: normal; overflow: visible; max-height: none; }
@media (min-width: 421px) { .rpanel .intro, .rpanel p.note { text-align: justify; -webkit-hyphens: auto; hyphens: auto; } .rpanel .intro code, .rpanel p.note code { -webkit-hyphens: manual; hyphens: manual; } }
.rpanel table.kv td:first-child { white-space: nowrap; width: 1%; padding-right: 14px; }
.rpanel table.kv td:last-child { white-space: normal; overflow-wrap: anywhere; }
@media (max-width: 420px) { .rpanel table.kv td:last-child { text-align: left; } }
/* scoped to the board: a bare #canvas also matched <h2 id="canvas"> of the help page "Where things go" and laid it over the help sidebar (2026-11-02) */
.board > #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; touch-action: none; cursor: grab; }
.board > #canvas.panning { cursor: grabbing; }
.board > #canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.nbox .prog { margin: 4px 0 0; }
/* the loading overlay (ui.js renderCard): over the drawing area while the readers load; blocks it; fades out when everything is verified */
.loadov { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: hidden;
  background: color-mix(in srgb, var(--app) 72%, transparent); backdrop-filter: blur(2px); transition: opacity .25s ease; }
.loadov.out { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .loadov { transition: none; } }
.lo-card { width: min(560px, 100%); background: var(--sheet); color: var(--ink); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px 20px; box-shadow: 0 10px 34px rgba(0, 0, 0, .18); overflow-wrap: anywhere; max-height: 100%; display: flex; flex-direction: column; }
.lo-card > .lo-rows { overflow-y: auto; min-height: 0; overscroll-behavior: contain; }   /* a short drawing area (a phone): the rows scroll, the button stays */
.lo-card h2 { margin: 0 0 4px; font-size: 17px; font-weight: 650; }
.lo-card > p { margin: 0 0 12px; color: var(--muted); font-size: 14px; line-height: 1.4; }
.lo-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.lo-row { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); }
.lo-row:first-child { border-top: 0; }
.lo-b { flex: 1; min-width: 0; display: grid; gap: 4px; }
.lo-h { font-size: 14.5px; } .lo-h span { color: var(--muted); font-size: 13px; }
.lo-s { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.lo-row .prog { margin: 2px 0 0; }
.lo-err { color: var(--err); font-size: 13px; }
.lo-acts { margin-top: 12px; display: flex; justify-content: flex-end; gap: 8px; }
.lo-row .lo-acts { margin-top: 4px; justify-content: flex-start; }
.lo-i { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; margin-top: 1px; }
.lo-i.ok { background: var(--accent); color: var(--accent-ink); }
.lo-i.bad { background: var(--err); color: #fff; }
.lo-i.wait { border: 2px dashed var(--line); }
.lo-i.spin { border: 2px solid var(--line); border-top-color: var(--accent); animation: lo-spin .9s linear infinite; }
@keyframes lo-spin { to { transform: rotate(360deg); } }
.lo-ind { position: relative; } .lo-ind > div { position: absolute; width: 35% !important; animation: lo-ind 1.3s ease-in-out infinite; }
@keyframes lo-ind { from { left: -35%; } to { left: 100%; } }
@media (prefers-reduced-motion: reduce) { .lo-i.spin, .lo-ind > div { animation: none; } }
.lo-row.wait .lo-h b { color: var(--muted); }
@media (max-width: 860px) { .loadov { padding: 8px; } .lo-card { padding: 12px 14px; } .lo-card h2 { font-size: 15.5px; } .lo-card > p { font-size: 13px; margin-bottom: 6px; }
  .lo-row { padding: 6px 0; gap: 10px; } .lo-h span { display: none; } .lo-acts { margin-top: 8px; } }
.acts { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.nbox { display: grid; gap: 6px; font-size: 13.5px; }
.nbox p { margin: 0; color: var(--muted); }
.sopbar { border-top: 1px solid var(--line); background: var(--head); padding: 5px 16px 7px; display: grid; gap: 4px; min-width: 0; }
.sophead { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); min-height: 24px; }
.sophead span { flex: 1; min-width: 0; }
.sophead .btn { padding: 2px 12px; font-size: 12.5px; }
.sop.mini { font-size: 11.5px; line-height: 1.5; padding: 4px 8px; max-height: 5.2em; overflow: auto; }
/* the canvas footer: the readout and the zoom (ui.js "Zoom and pan") */
.cfoot { position: absolute; left: 16px; bottom: 10px; display: flex; align-items: center; gap: 8px; z-index: 2; }
.zoomctl { display: inline-flex; align-items: center; background: var(--head); border-radius: 999px; box-shadow: 0 1px 2px rgba(0, 0, 0, .1); font-size: 12px; color: var(--muted); }
.zoomctl button { border: 0; background: none; color: var(--ink); font: inherit; font-size: 14px; line-height: 1; min-width: 28px; height: 24px; padding: 0 6px; border-radius: 999px; cursor: pointer; }
.zoomctl button:hover:not(:disabled) { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.zoomctl button:disabled { opacity: .4; cursor: default; }
.zoomctl #zoom-pct { min-width: 38px; text-align: center; font-variant-numeric: tabular-nums; }
.zoomctl .zfit { font-size: 12px; font-weight: 600; color: var(--muted); }
.zoomctl .zfit.hint { color: var(--accent-ink); background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
/* the names switch (ui.js "Name tags"): a pill like the readout, filled when the names show */
.namesbtn { font: inherit; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--head); border: 0; padding: 3px 10px; border-radius: 999px; box-shadow: 0 1px 2px rgba(0, 0, 0, .1); cursor: pointer; text-decoration: line-through; }
.namesbtn[aria-pressed="true"] { color: var(--ink); text-decoration: none; }
.readout { font-size: 12px; color: var(--muted); background: var(--head); padding: 3px 9px; border-radius: 999px; font-variant-numeric: tabular-nums; box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }

.shp { cursor: grab; touch-action: none; }
.shp .body { stroke-width: 1.5; }   /* fill and stroke: the colour's fill and edge (logic.js PALETTE, set by ui.js drawShape) */
.shp .body.outlined { stroke-width: 3; }
.shp .tag { font-family: var(--mono); font-size: 11px; fill: var(--muted); paint-order: stroke; stroke: var(--canvas); stroke-width: 3px; stroke-linejoin: round; }   /* a canvas halo: an arrow passing under the name does not strike it through */
.shp .lbl { font-family: var(--font); font-weight: 500; pointer-events: none; }
.shp .ftext { font-family: var(--font); font-weight: 650; }
.shp.background { cursor: default; }
.shp.background .body, .shp.zone .body { stroke-dasharray: 0; stroke-width: 1.25; stroke-opacity: .45; }
.shp.stage .body { stroke: none !important; }   /* the background panel that fills the board (ui.js stageExtent): its edge is the board's edge */
.shp.hl .halo { stroke: var(--hl); stroke-width: 2.5; fill: none; stroke-dasharray: 5 4; animation: march 1.2s linear infinite; }
.shp.hl .tag { fill: var(--hl); font-weight: 600; }
.edge .ln { stroke: var(--pc-arrow); stroke-width: 1.75; fill: none; }   /* an arrow without a colour (logic.js PALETTE_ARROW) */
.edge .hd { fill: var(--pc-arrow); }
.edge.hl .ln { stroke: var(--hl) !important; stroke-width: 3; }
.edge.hl .hd { fill: var(--hl) !important; }
/* direct editing (ui.js "Direct editing"): the selected item, and the inline editor over a text */
.shp .selbox { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 4 3; pointer-events: none; }
.edge.sel .ln { stroke: var(--accent) !important; stroke-width: 3.2; }
.edge.sel .hd { fill: var(--accent) !important; }
.edge { cursor: pointer; }
.inl-edit { position: absolute; z-index: 6; height: 30px; padding: 0 8px; border: 1.5px solid var(--accent); border-radius: 6px; background: var(--pill); color: var(--ink);
  font: 500 14px/28px var(--font); box-shadow: 0 2px 10px rgba(0,0,0,.15); outline: none; }
.edge .elbl { font-family: var(--font); font-size: 12px; fill: var(--ink); paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; stroke-linejoin: round; }
.frame { fill: none; stroke: var(--frame); stroke-dasharray: 6 6; }
.ftitle { font-family: var(--font); font-size: 13px; fill: var(--faint); font-weight: 600; }
.empty-note { font-family: var(--font); font-size: 16px; fill: var(--faint); }
@keyframes march { to { stroke-dashoffset: -18; } }
@media (prefers-reduced-motion: reduce) { .shp.hl .halo { animation: none; } }

/* ---------- messages ---------- */
.msgs { grid-area: msgs; overflow-y: auto; overscroll-behavior: contain; background-color: var(--chat); background-image: radial-gradient(var(--dots) 1.2px, transparent 1.3px); background-size: 18px 18px; padding: 12px 4% 8px; display: flex; flex-direction: column; gap: 3px; border-left: 1px solid var(--line); min-width: 0; }
.b { max-width: 86%; padding: 6px 9px 5px; border-radius: 8px; background: var(--bubble); box-shadow: 0 1px .5px rgba(11, 20, 26, .13); position: relative; overflow-wrap: anywhere; }
.b.me { align-self: flex-end; background: var(--mine); border-top-right-radius: 2px; }
.b.bot { align-self: flex-start; border-top-left-radius: 2px; }
.b + .b.me, .b.me + .b.bot { margin-top: 6px; }
.b .txt { white-space: pre-wrap; }
.b .rl { white-space: pre-wrap; }
.b .rl + .rl { margin-top: 3px; }
.b .rl > b { font-weight: 600; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.b .rl.err .t { color: var(--err); }
.b .rl.off { color: var(--muted); font-size: 13px; }
.b .rl .sub { white-space: normal; }
.b .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
.b.err .txt { color: var(--err); }
.b .fix { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.b .fix s { color: var(--faint); }
.meta { display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); margin-top: 2px; }
.meta button { border: 0; background: none; padding: 0; color: var(--link); cursor: pointer; font-size: 11.5px; }
.meta .tag2 { font-family: var(--mono); font-size: 10.5px; }
.meta .who { color: var(--faint); font-variant-numeric: tabular-nums; }   /* the reader of a one-line reply (ui.js chatLines) */
.b .held { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 5px; white-space: normal; }
.b .held li { border-left: 3px solid var(--line); padding: 2px 0 2px 8px; font-size: 13.5px; }
.b .held .src { font-weight: 500; }
.b .held .why { color: var(--muted); font-size: 13px; }
.b .held .anyway { display: inline-block; margin-top: 3px; border: 1px solid var(--line); background: var(--pill); color: var(--link); border-radius: 999px; padding: 2px 10px; cursor: pointer; font-size: 12.5px; }
.b .held .anyway:disabled { color: var(--muted); cursor: default; }
.b .hhead { margin-top: 4px; white-space: normal; }
.b .held .why { display: grid; gap: 1px; margin: 2px 0 0; }
.b .held .why .r::before { content: "– "; }
.b .held .how { margin-top: 3px; font-size: 13.5px; }
.b .held .runs { color: var(--muted); font-size: 13px; margin-top: 2px; }
.b .held .acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; }
.b .held .acts .anyway { margin-top: 0; }
.b .held .edit { border: 1px solid var(--line); background: transparent; color: var(--link); border-radius: 999px; padding: 2px 10px; cursor: pointer; font-size: 12.5px; }
.b .held .edit:disabled { color: var(--muted); cursor: default; }
.b .held .state { color: var(--muted); font-size: 12.5px; font-style: italic; }
.b .held li.superseded .src, .b .held li.superseded .why, .b .held li.superseded .how, .b .held li.superseded .runs { opacity: .6; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.chips button { border: 1px solid var(--line); background: var(--pill); color: var(--link); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 14px; }
.sys { overflow-wrap: anywhere; align-self: center; background: var(--pill); color: var(--muted); font-size: 12.5px; padding: 4px 12px; border-radius: 8px; margin: 8px 0; text-align: center; max-width: 90%; box-shadow: 0 1px .5px rgba(11, 20, 26, .1); }

/* ---------- player & composer ---------- */

.plug { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; display: grid; gap: 6px; }

.says { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }

.docs-nav ul { list-style: none; margin: 0; padding: 0; }
.docs-nav a { display: block; padding: 6px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 14.5px; line-height: 1.3; }
.docs-nav a:hover { background: rgba(127, 127, 127, .12); }
.docs-nav a[aria-current="page"] { background: var(--sheet); color: var(--accent); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.docs-scrim { display: none; }
.docs-main { overflow-y: auto; overscroll-behavior: contain; padding: 36px 40px 72px; scroll-padding-top: 12px; }
.docs-main .doc { margin: 0 auto; max-width: 78ch; }
@media (max-width: 860px) {
  .docs-brand span { display: none; }
  .docs-brand { flex: none; }
  .docs-menu-btn { display: inline-flex; align-items: center; gap: 6px; flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 6px 8px 6px 12px; cursor: pointer; font-size: 14px; }
  .docs-menu-btn .dm-l { color: var(--muted); flex: none; }
  .docs-menu-btn b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; text-align: left; }
  .docs-menu-btn svg.i { width: 18px; height: 18px; color: var(--muted); }
  .docs-body { grid-template-columns: minmax(0, 1fr); }
  .docs-nav { position: absolute; left: 0; right: 0; top: 0; max-height: min(78vh, 640px); z-index: 2; border-right: 0; border-bottom: 1px solid var(--line); box-shadow: 0 10px 24px rgba(0, 0, 0, .18); display: none; padding: 10px 8px 18px; }
  .docs.menu-open .docs-nav { display: block; }
  .docs.menu-open .docs-scrim { display: block; position: absolute; inset: 0; z-index: 1; background: rgba(11, 20, 26, .35); }
  .docs.menu-open .docs-menu-btn svg.i { transform: rotate(180deg); }
  .docs-main { padding: 22px 16px 56px; padding-bottom: max(56px, env(safe-area-inset-bottom, 0px)); }
}

/* ---------- phone ---------- */
/* phone keyboard open: shrink the drawing so the conversation stays usable */
.app.kb { grid-template-rows: auto minmax(0, 24%) minmax(0, 1fr) auto auto auto; }
.app.kb .cfoot, .app.kb .sopbar, .app.kb .subbar { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(180px, 46%) minmax(0, 1fr) auto auto auto; grid-template-areas: "head" "stage" "msgs" "player" "dock" "comp"; }
  .head { border-left: 0; padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); }
  .msgs, .player, .comp { border-left: 0; }
  .msgs { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .stage { border-bottom: 1px solid var(--line); }
  .rbar { padding: 6px 8px 0 16px; gap: 4px; }
  .rtab { padding: 7px 7px 8px; font-size: 13.5px; }
  .tools { gap: 0; }
  .tools .ib { width: 34px; height: 34px; }
  .sop.mini { max-height: 3.6em; }
  .b { max-width: 90%; }
  .sheet { width: 100%; }
}
</style>

</head>
<body>
<div class="app">
  <header class="head">
    <div class="avatar" aria-hidden="true">@</div>
    <div class="who"><b>Sketchpad</b><span id="status">draws what you write</span></div>
    <div class="gbadges" id="gate-badges" hidden></div>
    <button class="ib" type="button" id="open-settings" aria-label="Settings: replies, collected requests, spelling, capabilities" title="Settings: replies, collected requests, spelling, capabilities">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>
    </button>
  </header>

  <section class="stage" aria-label="Drawing">
    <div class="rbar">
      <div class="rtabs" id="rtabs" role="tablist" aria-label="Readers"></div>
      <div class="tools" id="tools">
        <button class="ib" type="button" id="align-btn" hidden aria-label="Copy this drawing to the other tabs" title="Copy this drawing to the other tabs"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
        <button class="ib" type="button" id="view-btn" aria-label="Show the whole canvas" title="Show the whole canvas"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="ib" type="button" data-say="Undo" data-sop="@t1 command action=undo" aria-label="Undo" title="Undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
        <button class="ib" type="button" data-say="Redo" data-sop="@t1 command action=redo" aria-label="Redo" title="Redo"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
        <button class="ib" type="button" data-say="Clear the canvas" data-sop="@m1 mention quantifier=all&#10;@t1 command action=delete target=$m1" aria-label="Clear the canvas" title="Clear the canvas"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg></button>
        <button class="ib" type="button" id="help-btn" aria-label="Help" title="Help: how to use it and how it works"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.5"/><path d="M12 16.8v.2"/></svg></button>
      </div>
    </div>
    <div class="subbar" id="subtabs" role="tablist" aria-label="What to show for this reader"></div>
    <div class="board">
      <svg id="canvas" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" role="img" tabindex="0" aria-label="Diagram. Drag the empty canvas or use the arrow keys to pan; Ctrl+wheel, pinch, + and − to zoom; 0 to fit">
        <defs><pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.1" style="fill: var(--grid)"/></pattern></defs>
        <rect id="bg" x="-5000" y="-5000" width="20000" height="20000" fill="url(#dots)"/>
        <g id="frames"></g>
        <g id="layer"></g>
      </svg>
      <div class="cfoot" id="cfoot">
        <div class="readout" id="readout">0 shapes</div>
        <div class="zoomctl" role="group" aria-label="Zoom">
          <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out (−)">−</button>
          <span id="zoom-pct" aria-live="polite" title="Zoom">100%</span>
          <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
          <button type="button" id="zoom-fit" class="zfit" aria-pressed="true" title="Fit the drawing to the view">fit</button>
        </div>
        <button type="button" class="namesbtn" id="names-btn" aria-pressed="true" title="Hide the names above the shapes">names</button>
      </div>
      <div class="loadov" id="loadov" hidden></div>
      <div class="rpanel" id="rpanel" role="tabpanel" hidden></div>
    </div>
  </section>

  <main class="msgs" id="msgs" aria-live="polite" aria-label="Conversation"></main>

  <div class="player" id="player" hidden></div>

  <section class="dock" id="dock" aria-label="Dictation: speak or type in your language"></section>

  <div class="comp" id="composer">
    <button class="ib" type="button" id="open-examples" aria-label="Examples" title="Examples"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <div class="field"><textarea id="say" rows="1" placeholder="Message" aria-label="Message" enterkeyhint="send" autocomplete="off" autocapitalize="sentences"></textarea></div>
    <button class="send" type="button" id="send-btn" aria-label="Send"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h13"/><path d="m12 5 7 7-7 7"/></svg></button>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="docs" id="docs" hidden role="dialog" aria-modal="true" aria-labelledby="docs-title">
  <header class="docs-bar">
    <button class="ib" type="button" id="docs-back" hidden aria-label="Back to the previous help page" title="Back"><svg class="i" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></button>
    <div class="docs-brand"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.5"/><path d="M12 16.8v.2"/></svg><b>Help</b><span>SOP Sketchpad</span></div>
    <button class="docs-menu-btn" type="button" id="docs-menu-btn" aria-expanded="false" aria-controls="docs-nav"><span class="dm-l">Pages</span><b id="docs-crumb"></b><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="ib" type="button" id="docs-close" aria-label="Close help (Esc)" title="Close (Esc)"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </header>
  <div class="docs-body">
    <nav class="docs-nav" id="docs-nav" aria-label="Help pages"></nav>
    <div class="docs-scrim" aria-hidden="true"></div>
    <main class="docs-main" id="docs-main"><article class="doc" id="docs-page"></article></main>
  </div>
</div>
<aside class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="sheet-title">
  <div class="sheet-head"><h2 id="sheet-title">Examples</h2><button class="ib" type="button" id="close-sheet" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <nav class="stabs" id="stabs" role="tablist"></nav>
  <div class="sbody" id="sbody"></div>
</aside>

<script src="js/templates.js"></script>
<script src="js/help-answers.js"></script>
<script src="js/start-diagram.js"></script>
<script src="js/auto-layout.js"></script>
<script src="js/logic.js"></script>
<script src="js/spell.js"></script>
<script src="js/scenes-extra.js"></script>
<script src="js/scenarios.js"></script>
<script src="js/examples.js"></script>
<script src="js/saved-reader.js"></script>
<script src="js/help.js"></script>
<script src="js/docs-concepts.js"></script>
<script src="js/docs-arch.js"></script>
<script src="js/docs.js"></script>
<script src="js/neural.js"></script>
<script type="module" src="js/bench-canon.js"></script>
<script src="js/collect.js"></script>
<script src="js/voice.js"></script>
<script src="js/ui.js"></script>

</body>
</html>
